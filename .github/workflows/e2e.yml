name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài phụ thuộc Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Chạy server nền
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 --log-level warning &
          for attempt in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "server sẵn sàng"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health > /dev/null || (echo "server không lên" && exit 1)

      - name: Chạy smoke test giao diện
        env:
          BASE_URL: http://127.0.0.1:8000
        run: node tests/e2e/smoke.cjs

      - name: Lưu ảnh chụp khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts
          if-no-files-found: ignore
