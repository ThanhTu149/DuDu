name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kiểm thử lõi (không cần mô hình ETA)
        run: python -m unittest discover -s tests -v

      - name: Kiểm tra cú pháp JavaScript
        run: node --check web/assets/app.js

      - name: Kiểm tra API import được
        run: python -c "from backend.app import app; print(len(app.routes), 'routes')"
